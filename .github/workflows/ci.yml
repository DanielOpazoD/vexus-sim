# Integración continua: lo mismo que `npm run check` en local (formato, lint,
# tipos, todas las pruebas con umbrales de cobertura, build y presupuesto de
# bundle) más la auditoría de dependencias de producción. Las matrices IQ se ejecutan
# sin instrumentación V8, conservando todas sus aserciones; el resto aporta cobertura.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · tipos · tests · build · presupuesto
    runs-on: ubuntu-latest
    # La matriz IQ corre en otro corredor; conserva umbrales y el veredicto exige ambas fases.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Todas las pruebas E2E previstas, una vez entre los fragmentos
        run: node --import tsx tools/ci/verify-e2e-shards.ts
      - name: Cobertura de fuentes (umbrales intactos)
        run: npm run test:coverage:core
      - name: Guardar informes para revisar tiempos y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-core
          include-hidden-files: true
          path: |
            .validation/core.json
            .validation/core.source.json
            .validation/coverage-summary.json
          retention-days: 14
          if-no-files-found: error
      - run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Índice de decisiones al día
        run: npx tsx tools/docs/decisions-index.ts --check
      - name: Guardar el build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  matrix-validation:
    name: Matrices exhaustivas IQ y anatomía
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run test:matrix
      - name: Guardar matriz y procedencia aunque falle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-matrix
          include-hidden-files: true
          path: |
            .validation/matrix.json
            .validation/matrix.source.json
          retention-days: 14
          if-no-files-found: error

  # En paralelo con `check` (no depende de él): el tiempo total de CI es el del más lento.
  # Repartida en ocho fragmentos, cada uno con un solo trabajador (playwright.config.ts): SwiftShader usa todos los
  # núcleos del corredor en cada cuadro, y con dos trabajadores por corredor las pruebas se disputaban la CPU, tardaban
  # el doble y agotaban sus plazos a días alternos (79 % de ejecuciones de main en rojo, septiembre de 2026).
  e2e:
    name: extremo a extremo (Chromium + SwiftShader) ${{ matrix.shard }}/${{ strategy.job-total }}
    runs-on: ubuntu-latest
    # El navegador y sus bibliotecas corresponden al lockfile; no descargar APT en cada fragmento.
    # CI37762865146 perdió 9 min en esa preparación y agotó el límite sin completar el informe.
    container:
      image: mcr.microsoft.com/playwright:v1.63.0-noble@sha256:eff16c30e6f3f4af0a03fa4b706120d5e9b0891c344a27d64559aff5900a4a27
    # un fragmento ronda los 10–15 min (la equivalencia sola, 3–6); con un reintento, más
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: El lockfile y la imagen fijada usan el mismo Playwright
        run: node -e "require('node:assert/strict').equal(require('@playwright/test/package.json').version, '1.63.0', 'Actualizar versión y digest de la imagen E2E junto al lockfile')"
      - run: npx vite build
      - run: node --import tsx tools/ci/run-e2e-shard.ts ${{ matrix.shard }} ${{ strategy.job-total }}
      - name: Guardar los tiempos (duración, arranque y ritmo del bucle de cada prueba)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tiempos-${{ matrix.shard }}
          include-hidden-files: true
          path: |
            e2e-results.json
            .validation/e2e-execution.json
          retention-days: 14
      - name: Guardar las capturas intestinales
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowel-visuals-${{ matrix.shard }}
          path: test-results/**/bowel-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Guardar el visor venoso
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: venous-visuals-${{ matrix.shard }}
          path: |
            test-results/**/venous-*.png
            test-results/**/pw-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # El veredicto que protege main (regla de la rama): verde solo si `check`, matriz IQ y todos los fragmentos E2E lo están.
  # Un solo nombre estable aunque cambie el número de fragmentos; `always()` para que un trabajo cancelado o fallido
  # dé rojo y no «omitido».
  veredicto:
    name: CI verde (check + e2e)
    if: always()
    needs: [check, matrix-validation, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: check, matriz IQ y E2E en verde
        run: |
          echo "check: ${{ needs.check.result }} · matriz: ${{ needs.matrix-validation.result }} · e2e: ${{ needs.e2e.result }}"
          test "${{ needs.check.result }}" = success
          test "${{ needs.matrix-validation.result }}" = success
          test "${{ needs.e2e.result }}" = success
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: validation-*
          path: .validation
          merge-multiple: true
      - name: Ambas fases, mismo SHA e informes íntegros, sin omisiones
        run: npm run test:coverage:verify
      - uses: actions/download-artifact@v8.0.1
        with:
          pattern: e2e-tiempos-*
          path: e2e-evidence
      - name: Todas las pruebas realmente ejecutadas, exactamente una vez
        run: node --import tsx tools/ci/verify-e2e-execution.ts e2e-evidence

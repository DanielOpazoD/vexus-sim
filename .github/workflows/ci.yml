# Integración continua: lo mismo que `npm run check` en local (formato, lint,
# tipos, todas las pruebas con umbrales de cobertura, build y presupuesto de
# bundle) más la auditoría de dependencias de producción. Las matrices IQ se ejecutan
# sin instrumentación V8, conservando todas sus aserciones; el resto aporta cobertura.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: lint · tipos · tests · build · presupuesto
    runs-on: ubuntu-latest
    # Cobertura completa observada ~18 min local; CI agotó20 min antes de build.
    # Margen operativo para terminar todos los gates, sin modificar timeouts de pruebas ni umbrales.
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Cobertura de fuentes (umbrales intactos)
        run: npm run test:coverage:core
      - name: Matrices IQ exhaustivas (sin instrumentación V8)
        run: npm run test:matrix
      - name: Ningún archivo omitido o duplicado entre fases
        run: npm run test:coverage:verify
      - name: Guardar informes para revisar tiempos y cobertura
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validation-reports
          include-hidden-files: true
          path: |
            .validation/*.json
            coverage/coverage-summary.json
          retention-days: 14
          if-no-files-found: error
      - run: npm run build
      - name: Auditoría de dependencias de producción
        run: npm audit --omit=dev --audit-level=high
      - name: Índice de decisiones al día
        run: npx tsx tools/docs/decisions-index.ts --check
      - name: Guardar el build
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist
          retention-days: 7

  # En paralelo con `check` (no depende de él): el tiempo total de CI es el del más lento.
  # Repartida en cinco fragmentos, cada uno con un solo trabajador (playwright.config.ts): SwiftShader usa todos los
  # núcleos del corredor en cada cuadro, y con dos trabajadores por corredor las pruebas se disputaban la CPU, tardaban
  # el doble y agotaban sus plazos a días alternos (79 % de ejecuciones de main en rojo, septiembre de 2026).
  e2e:
    name: extremo a extremo (Chromium + SwiftShader) ${{ matrix.shard }}/5
    runs-on: ubuntu-latest
    # un fragmento ronda los 10–15 min (la equivalencia sola, 3–6); con un reintento, más
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Versión de Playwright (clave de la caché de navegadores)
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - name: Caché de navegadores de Playwright
        id: pw-cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.pw.outputs.version }}
      - if: steps.pw-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium
      - if: steps.pw-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium
      - run: npx vite build
      - run: npm run e2e -- --shard=${{ matrix.shard }}/5
      - name: Guardar los tiempos (duración, arranque y ritmo del bucle de cada prueba)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-tiempos-${{ matrix.shard }}
          path: e2e-results.json
          retention-days: 14
      - name: Guardar las capturas intestinales
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: bowel-visuals-${{ matrix.shard }}
          path: test-results/**/bowel-*.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Guardar el informe si falla
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            playwright-report
            test-results
          retention-days: 7

  # El veredicto que protege main (regla de la rama): verde solo si `check` y los cinco fragmentos de la e2e lo están.
  # Un solo nombre estable aunque cambie el número de fragmentos; `always()` para que un trabajo cancelado o fallido
  # dé rojo y no «omitido».
  veredicto:
    name: CI verde (check + e2e)
    if: always()
    needs: [check, e2e]
    runs-on: ubuntu-latest
    steps:
      - name: check y los fragmentos de la e2e, en verde
        run: |
          echo "check: ${{ needs.check.result }} · e2e: ${{ needs.e2e.result }}"
          test "${{ needs.check.result }}" = success
          test "${{ needs.e2e.result }}" = success

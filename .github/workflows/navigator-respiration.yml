name: Respiración anatómica del navegador 3D
on:
  pull_request:
    paths:
      - 'src/ui/navigator3d.ts'
      - 'src/ui/navigator3d/respiratoryMotion.ts'
      - 'src/validation/navigatorRespiratoryMotion.test.ts'
      - 'tools/fidelity/respiratoryNavigatorComparison.ts'
      - '.github/workflows/navigator-respiration.yml'
permissions:
  contents: read
concurrency:
  group: navigator-respiration-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        profile: [legacy, reference]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Capturas y coste en la base exacta y el cambio
        run: node --import tsx tools/fidelity/respiratoryNavigatorComparison.ts
        env:
          COMPARISON_PROFILE: ${{ matrix.profile }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RESP_NAV_OUT: ${{ runner.temp }}/vexus-resp-nav-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: respiratory-navigator-before-after-${{ matrix.profile }}
          path: ${{ runner.temp }}/vexus-resp-nav-evidence
          retention-days: 7
          if-no-files-found: warn

  comparison:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ambos perfiles completos
        run: test '${{ needs.capture.result }}' = 'success'

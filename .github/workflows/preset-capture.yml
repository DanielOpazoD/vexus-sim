name: Capturas de ventanas predeterminadas
on:
  push:
    branches: ['qa/preset-window-capture']
permissions:
  contents: read
jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - run: node --import tsx tools/fidelity/capturePresets.ts
        env:
          PRESET_OUT: ${{ runner.temp }}/vexus-presets
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: ventanas-predeterminadas
          path: ${{ runner.temp }}/vexus-presets
          retention-days: 7
          if-no-files-found: warn

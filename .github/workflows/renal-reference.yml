name: Referencias renales offline
on:
  pull_request:
    paths:
      - 'tools/anatomy/**'
      - '.github/workflows/renal-reference.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
  push:
    branches: [main]
    paths:
      - 'tools/anatomy/**'
      - '.github/workflows/renal-reference.yml'
      - 'package.json'
      - 'package-lock.json'
      - '.nvmrc'
permissions:
  contents: read
jobs:
  reference:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - run: python -m pip install -r tools/anatomy/paired-renal-review-requirements.txt
      - name: Controles sintéticos, sin acceso a pacientes
        run: |
          python tools/anatomy/ct_vascular_reference_test.py
          python tools/anatomy/ct_posterior_reference_test.py
          python tools/anatomy/paired_renal_reference_test.py
          python tools/anatomy/paired_renal_registration_test.py
          python tools/anatomy/paired_renal_reslice_test.py

name: Comparación visual vertebral
on:
  pull_request:
    paths:
      - 'src/anatomy/scene.ts'
      - 'src/anatomy/gpu/anatomy.glsl.ts'
      - 'src/anatomy/interfaces.ts'
      - 'src/anatomy/tissues.ts'
      - 'src/ultrasound/interfaceEcho.ts'
      - 'e2e/vertebralCortex.spec.ts'
      - 'tools/fidelity/spineComparison.ts'
      - '.github/workflows/spine-visual.yml'
permissions:
  contents: read
concurrency:
  group: spine-visual-${{ github.ref }}
  cancel-in-progress: true
jobs:
  capture:
    strategy:
      fail-fast: false
      matrix:
        profile: [legacy, reference]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx vite build
      - name: Capturas y coste en la base exacta y el cambio
        run: node --import tsx tools/fidelity/spineComparison.ts
        env:
          COMPARISON_PROFILE: ${{ matrix.profile }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          SPINE_OUT: ${{ runner.temp }}/vexus-spine-evidence
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: spine-before-after-${{ matrix.profile }}
          path: ${{ runner.temp }}/vexus-spine-evidence
          retention-days: 7
          if-no-files-found: warn

  comparison:
    needs: capture
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Ambos perfiles completos
        run: test '${{ needs.capture.result }}' = 'success'

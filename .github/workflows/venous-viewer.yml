name: Visor venoso · validación rápida
on:
  pull_request:
    paths:
      - 'src/ui/panel/**'
      - 'src/ui/panel.ts'
      - 'src/bootstrap.ts'
      - 'src/ui/velocityRuler.ts'
      - 'src/ui/displays.ts'
      - 'e2e/velocityRuler.spec.ts'
      - 'src/app/styles.css'
      - 'src/physiology/**'
      - 'e2e/venousViewer.spec.ts'
      - 'e2e/renalTerritory.spec.ts'
      - 'src/doppler/**'
      - 'e2e/support.ts'
      - '.github/workflows/venous-viewer.yml'
permissions:
  contents: read
concurrency:
  group: venous-viewer-${{ github.ref }}
  cancel-in-progress: true
jobs:
  repeat:
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
        suite: [renalTerritory, venousViewer, velocityRuler]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Checkout is the PR head, whereas the event GITHUB_SHA is its synthetic merge.
      - run: GITHUB_SHA="$(git rev-parse HEAD)" npx vite build
      # Diagnóstico temprano adicional: la CI principal ejecuta también la suite completa.
      - run: npm run e2e -- e2e/${{ matrix.suite }}.spec.ts --forbid-only --repeat-each=1 --retries=0 --max-failures=1 --workers=1
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: venous-viewer-early-${{ matrix.attempt }}-${{ matrix.suite }}
          path: |
            e2e-results.json
            test-results
          retention-days: 7
          if-no-files-found: warn
